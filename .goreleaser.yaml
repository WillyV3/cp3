version: 2

project_name: claude-peers-v3

before:
  hooks:
    - go mod tidy

builds:
  - id: cp3
    main: ./cmd/cp3
    binary: cp3
    env: [CGO_ENABLED=0]            # pure Go — nats.go, no cgo
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags: [-s -w]
  - id: cp3-mcp
    main: ./cmd/cp3-mcp
    binary: cp3-mcp
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags: [-s -w]
  - id: cp3-opencode
    main: ./cmd/cp3-opencode
    binary: cp3-opencode
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags: [-s -w]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE, adapters/pi/peer.ts]

nfpms:
  - id: packages
    package_name: claude-peers-v3
    homepage: "https://github.com/WillyV3/claude-peers-v3"
    description: "Cross-runtime peer network for coding agents — NATS-native, injects into live TUIs"
    maintainer: "WillyV3 <noreply@github.com>"
    license: "MIT"
    formats: [deb, rpm, apk, archlinux]
    bindir: /usr/bin

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

brews:
  - name: claude-peers-v3
    repository:
      owner: WillyV3
      name: homebrew-tap
      branch: main
    directory: Formula
    homepage: "https://github.com/WillyV3/claude-peers-v3"
    description: "Cross-runtime peer network for coding agents — NATS-native, injects into live TUIs"
    license: "MIT"
    install: |
      bin.install "cp3"
      bin.install "cp3-mcp"
      bin.install "cp3-opencode"
    test: |
      system "#{bin}/cp3", "peers"
