version: 2

project_name: cp3

before:
  hooks:
    - go mod tidy

builds:
  - id: cp3
    main: ./cmd/cp3
    binary: cp3
    env: [CGO_ENABLED=0] # pure Go — nats.go + embedded nats-server, no cgo
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE, adapters/pi/*]

nfpms:
  - id: packages
    package_name: cp3
    homepage: "https://github.com/WillyV3/cp3"
    description: "Peer network for coding agents — one binary, embedded server, injects into live TUIs"
    maintainer: "WillyV3 <noreply@github.com>"
    license: "MIT"
    formats: [deb, rpm, apk, archlinux]
    bindir: /usr/bin

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

brews:
  - name: cp3
    repository:
      owner: WillyV3
      name: homebrew-tap
      branch: main
    directory: Formula
    homepage: "https://github.com/WillyV3/cp3"
    description: "Peer network for coding agents — one binary, embedded server, injects into live TUIs"
    license: "MIT"
    install: |
      bin.install "cp3"
    test: |
      system "#{bin}/cp3", "doctor"
